<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AES-GCM Encrypt/Decrypt</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>AES-GCM Encrypt/Decrypt</h2>

    <label for="plaintext">Plaintext:</label>
    <textarea id="plaintext" placeholder="Enter text here..."></textarea>

    <button onclick="encrypt()">Encrypt</button>

    <label for="keyIvBox">Combined Key + IV:</label>
    <input id="keyIvBox" type="text" readonly />

    <label for="cipherBox">Ciphertext:</label>
    <textarea id="cipherBox" readonly></textarea>

    <hr style="margin: 20px 0; border: 1px solid #444;" />

    <label for="combinedInput">Paste Combined Key + IV:</label>
    <input id="combinedInput" type="text" placeholder="Paste key:iv" />

    <label for="cipherInput">Paste Ciphertext:</label>
    <textarea id="cipherInput" placeholder="Paste ciphertext"></textarea>

    <button onclick="decrypt()">Decrypt</button>

    <label>Decrypted Output:</label>
    <textarea id="decryptedOutput" readonly></textarea>
  </div>

  <script src="encrypt.js"></script>
</body>
</html>
