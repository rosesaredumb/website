<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AES-GCM Encrypt/Decrypt</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: #ffffff;
      font-family: "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 30px;
    }

    .container {
      background-color: #2c2c2c;
      padding: 20px 30px;
      border-radius: 8px;
      width: 500px;
      box-shadow: 0 0 10px #000;
    }

    h2 {
      text-align: center;
      color: #00ffff;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      background-color: #1a1a1a;
      border: 1px solid #444;
      color: #eee;
      padding: 8px;
      margin-top: 4px;
      border-radius: 4px;
      font-size: 14px;
      resize: vertical;
    }

    textarea {
      min-height: 60px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      background-color: #007acc;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005f99;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: #333;
      color: #fff;
      padding: 12px 20px;
      border-radius: 5px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #qrContainer,
    #totpQR {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #qrcode canvas,
    #totpQR canvas {
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <!-- 🔐 TOTP Login -->
  <div id="authContainer" class="container">
    <h2>🔐 TOTP Authentication</h2>
    <label for="totpCode">Enter 6-digit code from your Authenticator:</label>
    <input id="totpCode" type="text" maxlength="6" />
    <button onclick="verifyTOTP()">Verify</button>
    <button onclick="showTOTPQR()">📷 Show TOTP QR</button>
    <div id="totpQR"></div>
  </div>

  <!-- 🔒 Main App (hidden until TOTP verified) -->
  <div id="mainApp" class="container" style="display: none;">
    <h2>AES-GCM Encrypt/Decrypt</h2>

    <label for="plaintext">Plain text:</label>
    <textarea id="plaintext" placeholder="Enter text here..."></textarea>
    <button onclick="encrypt()">Encrypt</button>

    <label for="keyIvBox">Combined Key + IV:</label>
    <input id="keyIvBox" type="text" readonly />
    <button onclick="copyToClipboard('keyIvBox')">📋 Copy Key + IV</button>

    <label for="cipherBox">Cipher text:</label>
    <textarea id="cipherBox" readonly></textarea>
    <button onclick="copyToClipboard('cipherBox')">📋 Copy Cipher text</button>

    <label>QR Code for:</label>
    <select id="qrType">
      <option value="keyIvBox">Combined Key + IV</option>
      <option value="cipherBox">Cipher text</option>
    </select>
    <button onclick="generateQRCode()">🔳 Generate QR Code</button>

    <div id="qrContainer">
      <div id="qrcode"></div>
    </div>

    <hr style="margin: 20px 0; border: 1px solid #444;" />

    <label for="combinedInput">Paste Combined Key + IV:</label>
    <input id="combinedInput" type="text" placeholder="Paste key:iv" />

    <label for="cipherInput">Paste Cipher text:</label>
    <textarea id="cipherInput" placeholder="Paste ciphertext"></textarea>
    <button onclick="decrypt()">Decrypt</button>

    <label>Decrypted Output:</label>
    <textarea id="decryptedOutput" readonly></textarea>
    <button onclick="copyToClipboard('decryptedOutput')">📋 Copy Output</button>
  </div>

  <div id="toast" class="toast"></div>

  <!-- ✅ Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jiangts/JS-OTP@master/lib/jsotp.min.js"></script>

  <!-- 🔧 Core Logic -->
  <script>
    // Show toast messages
    function showToast(message, duration = 3000) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = "toast show";
      setTimeout(() => toast.className = "toast", duration);
    }

    // Clipboard copy
    function copyToClipboard(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return showToast("⚠ Field not found");
      el.select?.();
      el.setSelectionRange?.(0, 99999);
      navigator.clipboard.writeText(el.value || el.innerText).then(() => {
        showToast("✅ Copied to clipboard");
      }).catch(err => {
        showToast("❌ Clipboard error: " + err.message);
      });
    }

    // Buffer conversion
    function strToBuf(str) {
      return new TextEncoder().encode(str);
    }

    function bufToStr(buf) {
      return new TextDecoder().decode(buf);
    }

    function bufToBase64(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)));
    }

    function base64ToBuf(base64) {
      return Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    }

    // AES Key generation
    async function generateKey() {
      return await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    }

    async function exportKey(key) {
      const raw = await crypto.subtle.exportKey("raw", key);
      return bufToBase64(raw);
    }

    async function importKey(base64Key) {
      const raw = base64ToBuf(base64Key);
      return await crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["encrypt", "decrypt"]);
    }

    // Encryption
    async function encrypt() {
      const plaintext = document.getElementById("plaintext").value.trim();
      if (!plaintext) return showToast("⚠ Enter text to encrypt");

      try {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await generateKey();
        const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, strToBuf(plaintext));
        const keyBase64 = await exportKey(key);
        const ivBase64 = bufToBase64(iv);
        const cipherBase64 = bufToBase64(encrypted);
        const combined = keyBase64 + ":" + ivBase64;

        document.getElementById("keyIvBox").value = combined;
        document.getElementById("cipherBox").value = cipherBase64;
        document.getElementById("combinedInput").value = combined;
        document.getElementById("cipherInput").value = cipherBase64;

        showToast("✅ Encrypted successfully");
      } catch (error) {
        showToast("❌ Encryption error: " + error.message);
      }
    }

    // Decryption
    async function decrypt() {
      const combined = document.getElementById("combinedInput").value.trim();
      const cipherBase64 = document.getElementById("cipherInput").value.trim();
      if (!combined || !cipherBase64) return showToast("⚠ Provide key + ciphertext");

      try {
        const [keyBase64, ivBase64] = combined.split(":");
        if (!keyBase64 || !ivBase64) {
          showToast("❌ Invalid key:iv format");
          return;
        }
        const key = await importKey(keyBase64);
        const iv = base64ToBuf(ivBase64);
        const ciphertext = base64ToBuf(cipherBase64);

        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
        document.getElementById("decryptedOutput").value = bufToStr(decrypted);
        showToast("✅ Decrypted successfully");
      } catch (err) {
        document.getElementById("decryptedOutput").value = "";
        showToast("❌ Decryption failed: " + err.message);
      }
    }

    // QR Code generator
    function generateQRCode() {
      const type = document.getElementById("qrType").value;
      const text = document.getElementById(type)?.value?.trim();
      const container = document.getElementById("qrcode");
      container.innerHTML = "";
      if (!text) return showToast("⚠ Nothing to generate QR from");
      new QRCode(container).makeCode(text);
      showToast("✅ QR Code generated");
    }

    // TOTP verification
    const secret = "JBSWY3DPEHPK3PXP";
    const totp = new jsOTP.totp();

    function verifyTOTP() {
      const input = document.getElementById("totpCode").value.trim();
      const currentCode = totp.getOtp(secret);
      if (input === currentCode) {
        document.getElementById("authContainer").style.display = "none";
        document.getElementById("mainApp").style.display = "block";
        showToast("✅ TOTP Verified");
      } else {
        showToast("❌ Invalid Code");
      }
    }

    // Show QR code for TOTP setup
    function showTOTPQR() {
      const uri = "otpauth://totp/MyEncryptorApp:user@example.com?secret=" + secret + "&issuer=MyEncryptorApp";
      const container = document.getElementById("totpQR");
      container.innerHTML = "";
      new QRCode(container, { text: uri, width: 200, height: 200 });
      showToast("✅ Scan this QR with Google Authenticator");
    }
  </script>
</body>

</html>
